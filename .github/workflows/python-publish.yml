name: Upload Python Package (TestPyPI)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  

      - name: Fetch tags
        run: git fetch --tags  

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Debug git state (optional but VERY useful)
        run: |
          echo "Tags:"
          git tag
          echo "Describe:"
          git describe --tags || true

      - name: Build release distributions
        run: |
          python -m pip install build setuptools-scm
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  testpypi-publish:
    runs-on: ubuntu-latest
    needs: release-build

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://test.pypi.org/project/Coraltb/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/